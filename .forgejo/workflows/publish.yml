name: Publish

on:
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@v7

      - name: install ant.
        run: |
          curl -fsSL https://antjs.org/install | bash
          echo "$HOME/.ant/bin" >> "$FORGEJO_PATH"

      - name: install packages.
        run: ant install

      - name: build everything.
        run: ant build

      - name: prepare release.
        run: |
          mkdir -p release

          (
            cd "dist/genres@${{ forgejo.ref_name }}"
            zip -qr "$FORGEJO_WORKSPACE/release/genres-${{ forgejo.ref_name }}.zip" .
          )

          sha256sum \
            "release/genres-${{ forgejo.ref_name }}.zip" \
            > "release/genres-${{ forgejo.ref_name }}.zip.sha256"

      - name: upload release assets.
        uses: https://code.vexcited.com/forgejo/upload-release-assets@v1
        with:
          files: release/*

      - uses: https://github.com/spicetify/actions/publish@v1
        with:
          dist: dist/genres@${{ forgejo.ref_name }}
          artifact: ${{ forgejo.server_url }}/${{ forgejo.repository }}/releases/download/${{ forgejo.ref_name }}/genres-${{ forgejo.ref_name }}.zip
          token: ${{ secrets.SPICETIFY_SUBMIT_TOKEN }}
